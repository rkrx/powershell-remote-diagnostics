name: Build Windows download

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach a Windows download (leave empty for a build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-build-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !inputs.release_tag && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Run Release tests on Windows
        run: dotnet test -c Release -m:1 --no-restore --blame-hang-timeout 2m --logger "trx;LogFileName=windows-tests.trx" --results-directory TestResults

      - name: Build self-contained Windows package
        run: ./scripts/Publish-Windows.ps1

      - name: Check packaged executable
        run: ./artifacts/win-x64/WindowsPowerShellRc.exe --version

      - name: Exercise REST execution from the extracted Windows ZIP
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP ("rc-package-" + [guid]::NewGuid())
          Expand-Archive ./artifacts/Windows-Powershell-RC-win-x64.zip $extracted
          $env:RC_TEST_EXECUTABLE = Join-Path $extracted 'WindowsPowerShellRc.exe'
          try {
            dotnet test -c Release -m:1 --no-build --no-restore --filter FullyQualifiedName~PackagedHostTests --logger "trx;LogFileName=packaged-tests.trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows package REST verification failed.' }
          } finally {
            Remove-Item Env:RC_TEST_EXECUTABLE
            Remove-Item $extracted -Recurse -Force
          }

      - name: Report failing Windows tests
        if: failure()
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$results = Get-Content $_.FullName -Raw
            foreach ($test in $results.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']")) {
              $details = "$($test.testName): $($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)"
              $escaped = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$escaped"
            }
          }

      - name: Upload Windows download
        id: download
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Windows-Powershell-RC-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download instructions
        env:
          DOWNLOAD_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 download
          [Download Windows-Powershell-RC-win-x64.zip]($env:DOWNLOAD_URL)

          Extract the complete ZIP and run WindowsPowerShellRc.exe.
          The package includes PowerShell 7 and .NET; no separate installation is required.
          "@ >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish versioned release download
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested Windows package
        uses: actions/download-artifact@v8
        with:
          name: Windows-Powershell-RC-win-x64.zip
          path: release
          skip-decompress: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          package="release/Windows-Powershell-RC-win-x64.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" --clobber
          else
            gh release create "$RELEASE_TAG" "$package" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
