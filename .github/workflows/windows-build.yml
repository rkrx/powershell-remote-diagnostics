name: Build server and client downloads
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach downloads (empty for build only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: diagnostics-build-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !inputs.release_tag && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    name: Test and package Windows server and client
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Run Windows suite
        run: dotnet test -c Release -m:1 --no-restore --blame-hang-timeout 2m --logger "trx;LogFileName=windows-tests.trx" --results-directory TestResults
      - name: Build separate self-contained packages
        run: ./scripts/Publish-Windows.ps1
      - name: Test extracted Windows downloads over TLS and MCP
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("rc-packages-" + [guid]::NewGuid())
          $server = Join-Path $root 'server'
          $client = Join-Path $root 'client'
          Expand-Archive ./artifacts/WindowsPowerShellRc-Server-win-x64.zip $server
          Expand-Archive ./artifacts/WindowsPowerShellRc-Client-win-x64.zip $client
          $env:RC_TEST_SERVER_EXECUTABLE = Join-Path $server 'WindowsPowerShellRc.Server.exe'
          $env:RC_TEST_CLIENT_EXECUTABLE = Join-Path $client 'WindowsPowerShellRc.Client.exe'
          try {
            & $env:RC_TEST_SERVER_EXECUTABLE --version
            & $env:RC_TEST_CLIENT_EXECUTABLE --version
            dotnet test -c Release -m:1 --no-build --no-restore --filter 'FullyQualifiedName~PackagedHostTests|FullyQualifiedName~McpProcessTests' --logger "trx;LogFileName=packaged-tests.trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { throw 'Extracted server/client verification failed.' }
          } finally {
            Remove-Item Env:RC_TEST_SERVER_EXECUTABLE, Env:RC_TEST_CLIENT_EXECUTABLE
            Remove-Item $root -Recurse -Force
          }
      - name: Report test failures
        if: failure()
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$results = Get-Content $_.FullName -Raw
            foreach ($test in $results.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']")) {
              $details = "$($test.testName): $($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)"
              Write-Host ("::error::" + $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: WindowsPowerShellRc-Server-win-x64.zip
          path: artifacts/WindowsPowerShellRc-Server-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: WindowsPowerShellRc-Client-win-x64.zip
          path: artifacts/WindowsPowerShellRc-Client-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
  macos:
    name: Package and test macOS client (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release -m:1 --no-restore --blame-hang-timeout 2m
      - name: Build self-contained macOS client
        run: ./scripts/Publish-Package.ps1 -Component Client -Runtime ${{ matrix.rid }}
      - name: Test extracted macOS client MCP connection
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("rc-client-" + [guid]::NewGuid())
          New-Item -ItemType Directory $root | Out-Null
          tar -xzf ./artifacts/WindowsPowerShellRc-Client-${{ matrix.rid }}.tar.gz -C $root
          $env:RC_TEST_CLIENT_EXECUTABLE = Join-Path $root 'WindowsPowerShellRc.Client.app/Contents/MacOS/WindowsPowerShellRc.Client'
          try {
            & $env:RC_TEST_CLIENT_EXECUTABLE --version
            dotnet test -c Release -m:1 --no-build --no-restore --filter FullyQualifiedName~McpProcessTests
            if ($LASTEXITCODE -ne 0) { throw 'Extracted macOS client verification failed.' }
          } finally {
            Remove-Item Env:RC_TEST_CLIENT_EXECUTABLE
            Remove-Item $root -Recurse -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: WindowsPowerShellRc-Client-${{ matrix.rid }}.tar.gz
          path: artifacts/WindowsPowerShellRc-Client-${{ matrix.rid }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish separate server and client downloads
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WindowsPowerShellRc-*
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Attach all downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          packages=(release/WindowsPowerShellRc-Server-win-x64.zip release/WindowsPowerShellRc-Client-win-x64.zip release/WindowsPowerShellRc-Client-osx-arm64.tar.gz release/WindowsPowerShellRc-Client-osx-x64.tar.gz)
          for package in "${packages[@]}"; do test -s "$package"; done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
