name: Build Windows download

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Run Release tests on Windows
        run: dotnet test -c Release -m:1 --no-restore --blame-hang-timeout 2m

      - name: Build self-contained Windows package
        run: ./scripts/Publish-Windows.ps1

      - name: Check packaged executable
        run: ./artifacts/win-x64/WindowsPowerShellRc.exe --version

      - name: Upload Windows download
        id: download
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Windows-Powershell-RC-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download instructions
        env:
          DOWNLOAD_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 download
          [Download Windows-Powershell-RC-win-x64.zip]($env:DOWNLOAD_URL)

          Extract the complete ZIP and run WindowsPowerShellRc.exe.
          The package includes PowerShell 7 and .NET; no separate installation is required.
          "@ >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish versioned release download
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested Windows package
        uses: actions/download-artifact@v8
        with:
          name: Windows-Powershell-RC-win-x64.zip
          path: release
          skip-decompress: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="release/Windows-Powershell-RC-win-x64.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" --clobber
          else
            gh release create "$RELEASE_TAG" "$package" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
